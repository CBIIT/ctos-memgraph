name: Build Image
permissions: 
  contents: write
  id-token: write
on:
  workflow_dispatch:
    inputs:
      #environment:
      #  description: 'Which account the ECR repository is in'
      #  type: environment
      memgraph_type:
        description: 'Which type of memgraph to build with'
        type: choice
        options:
          - memgraph
          - memgraph-mage
      memgraph_version:
        description: 'Version of memgraph to use'
        type: choice
        options:
          - 3.13
          - 3.12
      ubuntu_version:
        description: 'Version of Ubuntu to use as the base image (warning, 26.04 not available for memgraph versions before 3.13'
        type: choice
        options:
          - 26.04
          - 24.04
          - 22.04
      fail_on_trivy_scan:
        type: boolean
        description: fail the build if vulnerabilities are found
        required: false
        default: false

jobs:
  build:
    name: Build Image
    runs-on: ubuntu-latest
    #environment: ${{ inputs.environment }}
    env:
        #ECR_REPOSITORY: ${{ github.repository }} 
        ECR_REPOSITORY: ctos-memgraph
        #SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        AWS_ROLE_TO_ASSUME: ${{ secrets.AWS_ROLE_TO_ASSUME }}
        AWS_REGION: ${{ secrets.AWS_REGION }}
    
    steps:
    - name: Check out code
      uses: actions/checkout@v7
      
    - name: Set Image Tag
      run: |
        build_date=`date "+%Y-%m-%d_%H-%M-%S"`
        echo IMAGE_TAG=${{ inputs.memgraph_type }}_${{ inputs.memgraph_version }}_${{ inputs.memgraph_version }}_$build_date >> $GITHUB_ENV
      
    - name: Build
      id: build-image
      run: |
        docker build -t ${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }} . --build-arg MEMGRAPH_TYPE=${{ inputs.memgraph_type }} --build-arg MEMGRAPH_VERSION=${{ inputs.memgraph_version }} --build-arg UBUNTU_VERSION=${{ inputs.ubuntu_version }}

    - name: Set Trivy exit code
      run: |
        if  [[ ${{ inputs.fail_on_trivy_scan }} == true ]];
        then
          echo 'TRIVY_EXIT_CODE=1' >> $GITHUB_ENV
        else
          echo 'TRIVY_EXIT_CODE=0' >> $GITHUB_ENV
        fi

    - name: Run Trivy vulnerability scanner
      id: trivy-scan
      uses: aquasecurity/trivy-action@b2933f565dbc598b29947660e66259e3c7bc8561
      with:
        image-ref: '${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}'
        format: 'table'
        exit-code: '${{ env.TRIVY_EXIT_CODE }}'
        ignore-unfixed: true
        #severity: 'CRITICAL,HIGH'
        severity: 'CRITICAL'

    - name: AWS OIDC Authentication
      #uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502
      uses: aws-actions/configure-aws-credentials@v6.2.4
      with:
        role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
        aws-region: ${{ env.AWS_REGION }}
        role-session-name: ${{ github.actor }}

    #- name: Create Git tag for Image
    #  run: |
    #    git config user.name "GitHub Actions"
    #    git config user.email "github-actions@users.noreply.github.com"
    #    git tag ${{ env.IMAGE_TAG }}
    #    git push origin ${{ env.IMAGE_TAG }}

    - name: Login to Amazon ECR
      id: login-aws-ecr
      uses: aws-actions/amazon-ecr-login@5a88a04c91d5c6f97aae0d9be790e64d9b1d47b7
    
    - name: Push to Amazon ECR
      id: push-image
      env:
        ECR_REGISTRY: ${{ steps.login-aws-ecr.outputs.registry }}
      run: |
        docker tag  $ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

    #- name: Slack Notification
    #  uses: act10ns/slack@87c73aef9f8838eb6feae81589a6b1487a4a9e08
    #  with:
    #    status: ${{ job.status }}
    #    steps: ${{ toJson(steps) }}
    #  if: always()
